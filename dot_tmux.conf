#############################################
# Nice tmux conf by Dentych.                #
# Everyone may use it.                      #
# It's created for my own pleasure          #
#############################################

# Rebind prefix
#unbind C-b
#set -g prefix C-a
#bind C-a send-prefix

# Start index from 1 instead of 0
set -g base-index 1

# Enable mouse control (clickable windows, panes, resizable panes)
#set -g mouse-select-window on
#set -g mouse-select-pane on
#set -g mouse-resize-pane on
# Enable mouse mode (tmux 2.1 and above)
set -g mouse on

set -sg escape-time 0

# Set terminal to 256 colors, which is awesome
# set -g default-terminal "screen-256color"
# Fix Colors
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"

# Toggle mouse functions on/off
bind m set -g mouse-select-window on \; set -g mouse-select-pane \; set -g mouse-resize-pane

# Kill screen style
bind k confirm-before "kill-window"

# Split window, keep current directory
bind c new-window -c '#{pane_current_path}'
bind C command-prompt -p "window name:" "new-window -n '%%'"
bind % split-window -h -c '#{pane_current_path}'
bind '"' split-window -c '#{pane_current_path}'

# Rename window/session with an empty prompt instead of the current name
bind , command-prompt -p "window name:" "rename-window -- '%%'"
bind '$' command-prompt -p "session name:" "rename-session -- '%%'"

# switch panes using Alt-arrow without prefix
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# don't rename windows automatically
set-option -g allow-rename off

# TrueColors for neovim
set-option -ga terminal-overrides ",xterm-256color:Tc"

# Enable vim keybinds when searching in tmux
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line

## Attempt to get notified when Claude is stuck
# Pass the terminal's focus reports into panes. Without this, claude-notify.sh
# can't tell whether a pane is being watched, and Claude Code itself falls back
# to a "did you type in the last 60s" guess for presence.
set -g focus-events on

set -g bell-action other
# 'on' = status-line message + window flag, but the bell is not passed through to
# Alacritty. claude-notify.sh already sends the desktop notification, so letting
# it through would fire notify-bell.sh on top of it.
set -g visual-bell on
set -g monitor-bell on
set -g activity-action none
set -g monitor-activity off

