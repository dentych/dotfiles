theme = "custom_jetbrains_dark"

[editor]
true-color = true
line-number = "relative"
#mouse = false
completion-timeout = 100

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[editor.lsp]
goto-reference-include-declaration = false

[keys.normal]
esc = ["collapse_selection"]
C-c = ["collapse_selection"]
X = "extend_line_above"
C-g = [
    ":write-all",
    ":new",
    ":insert-output lazygit",
    ":buffer-close!",
    ":redraw",
    ":reload-all"
]

[keys.normal.z]
C-c = "normal_mode"
w = ":toggle soft-wrap.enable"

[keys.select]
C-c = "normal_mode"

[keys.normal.space]
C-c = "normal_mode"
space = "file_picker"
B = ":sh git blame -L %{cursor_line},+1 %{buffer_name}"
x = [
    ":write-all",
    ":new",
    ":insert-output yazi",
    ":buffer-close!",
    ":redraw",
    ":reload-all"
]

[keys.insert]
C-c = "normal_mode"
